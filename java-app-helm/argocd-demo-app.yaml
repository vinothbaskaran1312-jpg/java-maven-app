apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/vinothbaskaran1312-jpg/java-maven-app.git
    targetRevision: main
    path: java-app-helm

  destination:
    server: https://kubernetes.default.svc
    namespace: helm-dev 

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
